<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portföy Takip</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; display: flex; flex-direction: column; align-items: center; margin: 0; }
        .dashboard { background: #161b22; padding: 25px; border-radius: 12px; width: 100%; max-width: 450px; border: 1px solid #30363d; margin-bottom: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .stat-box { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #30363d; font-size: 16px; }
        .stat-box:last-child { border-bottom: none; }
        .profit { color: #3fb950; font-weight: bold; }
        .loss { color: #f85149; font-weight: bold; }
        .asset { background: #21262d; padding: 15px; margin-bottom: 10px; border-radius: 8px; width: 100%; max-width: 450px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #30363d; }
        h2, h3 { color: #58a6ff; margin-top: 0; text-align: center; }
    </style>
</head>
<body>
    <div class="dashboard">
        <h2>Genel Portföy Durumu</h2>
        <div class="stat-box"><span>Toplam Yatırılan Para:</span> <span id="totalInvested">Yükleniyor...</span></div>
        <div class="stat-box"><span>Mevcut Toplam Değer:</span> <span id="currentTotal">-</span></div>
        <div class="stat-box"><span>Tüm Zamanlar Kâr/Zarar:</span> <span id="totalPnl">-</span></div>
    </div>

    <div id="assetList" style="width: 100%; max-width: 450px;"></div>

    <script>
        async function fetchPortfolio() {
            try {
                const res = await fetch('/api/portfolio');
                const data = await res.json();

                const pnlClass = data.totalPnl >= 0 ? 'profit' : 'loss';
                const sign = data.totalPnl >= 0 ? '+' : '';

                document.getElementById('totalInvested').innerText = `$${data.totalInvested.toFixed(2)}`;
                document.getElementById('currentTotal').innerText = `$${data.currentTotal.toFixed(2)}`;
                document.getElementById('totalPnl').innerHTML = `<span class="${pnlClass}">${sign}$${data.totalPnl.toFixed(2)} (${sign}${data.totalPnlPercent.toFixed(2)}%)</span>`;

                const assetList = document.getElementById('assetList');
                assetList.innerHTML = '<h3>Varlık Detayları</h3>';
                
                data.assets.forEach(asset => {
                    const aClass = asset.pnl >= 0 ? 'profit' : 'loss';
                    const aSign = asset.pnl >= 0 ? '+' : '';
                    assetList.innerHTML += `
                        <div class="asset">
                            <div>
                                <strong style="font-size: 18px; color: white;">${asset.symbol}</strong><br>
                                <small style="color: #8b949e;">Maliyet: $${asset.buyPrice} | Güncel: $${asset.currentPrice}</small>
                            </div>
                            <div style="text-align: right;">
                                <div style="color: white; font-weight: bold;">$${asset.current.toFixed(2)}</div>
                                <div class="${aClass}">${aSign}$${asset.pnl.toFixed(2)}</div>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("API Hatası:", err);
                document.getElementById('totalInvested').innerText = "Veri çekilemedi";
            }
        }
        fetchPortfolio();
    </script>
</body>
</html>
